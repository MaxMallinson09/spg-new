[build]
  command = "vite build"
  publish = "dist/client"

[build.environment]
  # AUTH0_DOMAIN and AUTH0_CLIENT_ID are public identifiers for a PKCE client,
  # not secrets. They are now read at runtime by the edge function rather than
  # inlined into the bundle, so nothing here should ever hold a client secret.
  SECRETS_SCAN_OMIT_KEYS = "AUTH0_DOMAIN,AUTH0_CLIENT_ID,AUTH0_AUDIENCE"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888

[[headers]]
  for = "/*"

  [headers.values]
    # script-src keeps 'unsafe-inline' because TanStack Start ships its
    # hydration payload as an inline <script>. Locking that down needs
    # per-request nonces, which the static publish path cannot issue. The
    # origin allowlist still blocks loading attacker-hosted script.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
